name: Nix CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '**/Directory.Build.props'
      - '**/Directory.Packages.props'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'
    tags:
      - 'cli-*'
  pull_request:
    paths:
      - '**/*.csproj'
      - '**/Directory.Build.props'
      - '**/Directory.Packages.props'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix.yml'

jobs:
  nix-build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve Ref
        id: ref
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ref=main" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.head_ref }}" ]]; then
            echo "ref=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.NIX_PAT }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Sync Version
        if: startsWith(github.ref, 'refs/tags/cli-')
        run: |
          VERSION="${GITHUB_REF_NAME#cli-}"
          sed -i "s/version = \".*\";/version = \"$VERSION\";/" flake.nix

      - name: Fetch Dependencies
        run: nix run .#fetch-deps -- nix/deps.json

      - name: Commit Changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(nix): auto-update nix/deps.json hashes"
          file_pattern: "flake.nix nix/deps.json"

      - name: Build
        run: nix build .
